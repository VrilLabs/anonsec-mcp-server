<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="auto" preserveAspectRatio="none">
  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes glow {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(99, 102, 241, 0.3)); }
      50% { filter: drop-shadow(0 0 20px rgba(99, 102, 241, 0.6)); }
    }
    @keyframes rotate {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .circuit-grid {
      animation: float 6s ease-in-out infinite;
    }
    .shield {
      animation: pulse 4s ease-in-out infinite;
    }
    .envelope {
      animation: float 5s ease-in-out infinite reverse;
    }
    .node {
      animation: glow 3s ease-in-out infinite;
    }
    .pulse-ring {
      transform-origin: center;
      animation: rotate 20s linear infinite;
    }
  </style>
  
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.8" />
    </linearGradient>
    
    <linearGradient id="envelopeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:0.7" />
    </linearGradient>
    
    <radialGradient id="nodeGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0" />
    </radialGradient>
    
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="1" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGradient)" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" opacity="0.5" />

  <!-- Left: Circuit Grid (MCP/Protocol representation) -->
  <g class="circuit-grid" transform="translate(100, 50)">
    <!-- Hexagonal circuit nodes -->
    <g class="node" transform="translate(0, 0)">
      <circle cx="0" cy="0" r="8" fill="#6366f1" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3" />
    </g>
    <g class="node" transform="translate(80, 0)">
      <circle cx="0" cy="0" r="8" fill="#8b5cf6" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.3" />
    </g>
    <g class="node" transform="translate(160, 0)">
      <circle cx="0" cy="0" r="8" fill="#3b82f6" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3" />
    </g>
    <g class="node" transform="translate(40, 52)">
      <circle cx="0" cy="0" r="8" fill="#1d4ed8" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#1d4ed8" stroke-width="1" opacity="0.3" />
    </g>
    <g class="node" transform="translate(120, 52)">
      <circle cx="0" cy="0" r="8" fill="#6366f1" />
      <circle cx="0" cy="0" r="20" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3" />
    </g>
    
    <!-- Connecting lines -->
    <line x1="0" y1="0" x2="80" y2="0" stroke="#6366f1" stroke-width="2" opacity="0.6" />
    <line x1="80" y1="0" x2="160" y2="0" stroke="#8b5cf6" stroke-width="2" opacity="0.6" />
    <line x1="0" y1="0" x2="40" y2="52" stroke="#3b82f6" stroke-width="2" opacity="0.6" />
    <line x1="40" y1="52" x2="120" y2="52" stroke="#1d4ed8" stroke-width="2" opacity="0.6" />
    <line x1="120" y1="52" x2="160" y2="0" stroke="#6366f1" stroke-width="2" opacity="0.6" />
    
    <!-- Pulsing center node -->
    <circle cx="80" cy="26" r="12" fill="none" stroke="#6366f1" stroke-width="3" class="shield">
      <animate attributeName="r" values="12;16;12" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="26" r="4" fill="#6366f1" class="shield" />
  </g>

  <!-- Center: Shield (Security) -->
  <g class="shield" transform="translate(450, 100)">
    <path d="M 0 -60 L 40 -20 L 40 40 L -40 40 L -40 -20 Z" fill="url(#shieldGradient)" stroke="none" />
    <path d="M 0 -60 L 40 -20 L 40 40 L -40 40 L -40 -20 Z" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.6" />
    
    <!-- Lock symbol inside shield -->
    <rect x="-12" y="-10" width="24" height="30" rx="4" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="0" cy="5" r="6" fill="none" stroke="#e2e8f0" stroke-width="2" />
    <line x1="0" y1="-2" x2="0" y2="8" stroke="#e2e8f0" stroke-width="2" />
    
    <!-- Surrounding pulse rings -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3" class="pulse-ring" />
    <circle cx="0" cy="0" r="90" fill="none" stroke="#8b5cf6" stroke-width="1" opacity="0.2" class="pulse-ring" />
  </g>

  <!-- Right: Envelope (Email) -->
  <g class="envelope" transform="translate(850, 80)">
    <!-- Envelope body -->
    <path d="M 0 0 L 100 0 L 100 80 L 50 100 L 0 80 Z" fill="url(#envelopeGradient)" stroke="none" />
    <path d="M 0 0 L 100 0 L 100 80 L 50 100 L 0 80 Z" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.6" />
    
    <!-- Envelope flap -->
    <path d="M 0 0 L 50 50 L 100 0" fill="none" stroke="#e2e8f0" stroke-width="2" opacity="0.8" />
    
    <!-- Email lines -->
    <line x1="15" y1="20" x2="85" y2="20" stroke="#e2e8f0" stroke-width="1.5" opacity="0.8" />
    <line x1="15" y1="35" x2="75" y2="35" stroke="#e2e8f0" stroke-width="1.5" opacity="0.8" />
    <line x1="15" y1="50" x2="85" y2="50" stroke="#e2e8f0" stroke-width="1.5" opacity="0.8" />
    
    <!-- Floating particles (representing anonymity/encryption) -->
    <circle cx="20" cy="-10" r="4" fill="#6366f1" opacity="0.7">
      <animate attributeName="cy" values="-10;5;-10" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="80" cy="-15" r="4" fill="#8b5cf6" opacity="0.7">
      <animate attributeName="cy" values="-15;10;-15" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="40" cy="-8" r="3" fill="#3b82f6" opacity="0.7">
      <animate attributeName="cy" values="-8;8;-8" dur="3s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Project Title Overlay -->
  <g transform="translate(600, 220)" text-anchor="middle">
    <text x="0" y="0" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="32" font-weight="700" fill="#f8fafc">
      ANONSEC MCP SERVER
    </text>
    <text x="0" y="40" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
          font-size="16" font-weight="400" fill="#94a3b8" opacity="0.9">
      Anonymous Email Management
    </text>
  </g>

  <!-- Bottom accent bars -->
  <g transform="translate(0, 280)">
    <rect x="0" y="0" width="300" height="20" fill="#6366f1" opacity="0.3" />
    <rect x="300" y="0" width="600" height="20" fill="#8b5cf6" opacity="0.2" />
    <rect x="900" y="0" width="300" height="20" fill="#3b82f6" opacity="0.3" />
  </g>
</svg>
